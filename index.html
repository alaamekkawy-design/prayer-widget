<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:auto; overflow-x:hidden; background:#fff; font-family:'Cairo',sans-serif; overscroll-behavior-y:contain;  }
body { display:flex; justify-content:center; }

.widget { width:100vw; padding:3vw; background:#fff; position:relative; }

/* Settings button */
.settings-btn {
  position:absolute; top:3vw; left:3vw;
  width:7vw; height:7vw; border-radius:50%;
  border:1.5px solid #1a3a6b; background:none;
  color:#1a3a6b; font-size:4vw; cursor:pointer;
  display:flex; align-items:center; justify-content:center; z-index:10;
}

/* Location bar */
.location-bar { display:flex; justify-content:center; gap:2vw; margin-bottom:2vw; flex-wrap:wrap; }
.loc-btn {
  font-family:'Cairo',sans-serif; font-size:2.8vw;
  padding:0.8vw 2.5vw; border:1px solid #1a3a6b;
  border-radius:12px; background:white; color:#1a3a6b; cursor:pointer; transition:all .2s;
}
.loc-btn.active { background:#1a3a6b; color:white; }

/* Day name */
.day-name-ar { text-align:center; font-family:'Amiri',serif; font-size:9vw; font-weight:700; color:#1a3a6b; line-height:1; margin-top:4vw; }
.day-name-en {
  display:block; text-align:center; font-size:3vw; font-weight:600; color:#1a3a6b;
  letter-spacing:3px; border:1.5px solid #1a3a6b; padding:1vw 4vw;
  margin:1vw auto 2vw; width:fit-content;
}

/* Date row */
.dates-row { display:flex; border-top:1.5px solid #1a3a6b; border-bottom:1.5px solid #1a3a6b; margin-bottom:2px; }
.date-block { flex:1; text-align:center; padding:8px 8px 0; }
.date-block:first-child { border-left:1.5px solid #1a3a6b; }
.date-num { font-family:'Amiri',serif; font-size:18vw; font-weight:700; color:#1a3a6b; line-height:.95; display:block; }
.date-month-ar { font-family:'Amiri',serif; font-size:5vw; font-weight:700; color:#1a3a6b; display:block; line-height:1.2; }
.date-year { font-size:4.5vw; font-weight:700; color:#1a3a6b; display:block; line-height:1.3; }

/* Greg/Coptic line */
.gregorian-line { display:flex; align-items:center; justify-content:center; gap:8vw; margin:1.5vw 0 1vw; direction:ltr; }
.gregorian-line .badge { font-size:2.6vw; color:white; border-radius:10px; padding:.5vw 2vw; background:#1a3a6b; }
.gregorian-line .coptic { font-size:2.6vw; color:#1a3a6b; border:1px solid #1a3a6b; padding:.5vw 2vw; border-radius:10px; direction:rtl; }

/* Prayer table */
.prayer-table { width:100%; border-collapse:collapse; margin-top:1.5vw; font-size:2.8vw; direction:rtl; table-layout:fixed; }
.prayer-table th, .prayer-table td { padding:1.2vw .5vw; text-align:center; border:.5px solid #c5cfe0; color:#1a3a6b; }
.prayer-table th { background:#f0f4fa; font-weight:700; font-size:2.6vw; }
.prayer-table tr:nth-child(even) td { background:#f5f7fb; }

/* Next prayer box */
.next-prayer-box {
  background:#1a3a6b; border-radius:8px; margin-top:2vw; padding:2vw 3vw;
  display:flex; align-items:center; justify-content:space-between; direction:rtl;
}
.next-prayer-label { color:#a8c0e8; font-size:2.5vw; font-weight:600; }
.next-prayer-name  { color:#fff; font-family:'Amiri',serif; font-size:5vw; font-weight:700; margin-top:.5vw; }
.next-prayer-time  { color:#f0c040; font-size:3vw; font-weight:600; margin-top:.3vw; }
.countdown-box     { text-align:center; }
.countdown-label   { color:#a8c0e8; font-size:2.5vw; }
.countdown-timer   { color:#fff; font-size:6vw; font-weight:700; letter-spacing:1px; margin-top:.5vw; }

/* Day navigation */
.day-nav {
  display:flex; justify-content:space-between; align-items:center;
  margin-top:3vw; gap:2vw;
}
.nav-btn {
  flex:1; padding:2.5vw 0; background:white;
  border:1.5px solid #1a3a6b; border-radius:2vw;
  color:#1a3a6b; font-family:'Cairo',sans-serif;
  font-size:3vw; font-weight:700; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:1vw;
  transition:all .2s;
}
.nav-btn:active { background:#1a3a6b; color:white; }
.nav-btn.today-indicator {
  background:#f0f4fa; border-color:#a8c0e8; color:#a8c0e8; cursor:default;
  font-size:2.5vw;
}
.day-offset-label {
  flex:0 0 auto; text-align:center;
  font-size:2.5vw; color:#1a3a6b; font-weight:700;
  min-width:12vw;
}

/* Footer */
.footer { text-align:center; font-family:'Amiri',serif; font-size:3.5vw; font-weight:700; color:#1a3a6b; margin-top:2vw; padding-top:2vw; border-top:1px solid #c5cfe0; display:flex; align-items:center; justify-content:center; gap:1.5vw; }
.footer img { height:4.5vw; width:4.5vw; object-fit:contain; }
.loading { text-align:center; color:#1a3a6b; font-size:3vw; padding:2vw; opacity:.6; }

/* ── Weather ── */
.weather-box {
  margin-top: 2vw;
  background: linear-gradient(135deg, #1a3a6b 0%, #2a5298 100%);
  border-radius: 3vw;
  padding: 3vw;
  direction: rtl;
  color: white;
}
.weather-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.weather-temp {
  font-size: 10vw;
  font-weight: 900;
  line-height: 1;
}
.weather-unit {
  font-size: 4vw;
  font-weight: 400;
  vertical-align: super;
}
.weather-icon {
  width: 14vw;
  height: 14vw;
}
.weather-condition {
  font-size: 3vw;
  font-weight: 600;
  opacity: .9;
  margin-top: .5vw;
  text-align: center;
}
.weather-details {
  display: flex;
  justify-content: space-around;
  margin-top: 2.5vw;
  padding-top: 2vw;
  border-top: 1px solid rgba(255,255,255,.2);
}
.weather-detail {
  text-align: center;
}
.weather-detail-val {
  font-size: 3.5vw;
  font-weight: 700;
}
.weather-detail-lbl {
  font-size: 2.3vw;
  opacity: .7;
  margin-top: .5vw;
}
.weather-loading {
  text-align: center;
  font-size: 3vw;
  opacity: .7;
  padding: 3vw;
}
.weather-city-name {
  font-size: 2.8vw;
  opacity: .8;
  margin-bottom: 1vw;
}

/* ══ Date Picker ══ */
.datepicker-overlay {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,.45); z-index:200;
  align-items:center; justify-content:center;
}
.datepicker-overlay.open { display:flex; }

.datepicker-panel {
  background:#fff; width:88vw; max-width:360px;
  border-radius:4vw; padding:4vw;
  box-shadow:0 8px 32px rgba(0,0,0,.25);
  direction:rtl;
}
@media(min-width:560px){ .datepicker-panel{ border-radius:16px; padding:20px; } }

/* ── Header row ── */
.dp-header {
  display:flex; align-items:center;
  justify-content:space-between; margin-bottom:2.5vw; gap:1vw;
}
@media(min-width:560px){ .dp-header{ margin-bottom:12px; gap:4px; } }

.dp-title-group {
  display:flex; gap:1.5vw; align-items:center; flex:1; justify-content:center;
}
@media(min-width:560px){ .dp-title-group{ gap:6px; } }

.dp-title-btn {
  background:#f0f4fa; border:1px solid #c5cfe0;
  border-radius:1.5vw; padding:.8vw 2vw;
  font-family:'Cairo',sans-serif; font-size:3.2vw;
  font-weight:700; color:#1a3a6b; cursor:pointer;
  transition:all .15s;
}
.dp-title-btn:hover { background:#1a3a6b; color:white; }
@media(min-width:560px){ .dp-title-btn{ border-radius:6px; padding:3px 10px; font-size:15px; } }

.dp-nav {
  background:none; border:1.5px solid #1a3a6b;
  border-radius:50%; width:7vw; height:7vw; min-width:7vw;
  color:#1a3a6b; font-size:3vw; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all .15s;
}
.dp-nav:hover { background:#1a3a6b; color:white; }
@media(min-width:560px){ .dp-nav{ width:30px; height:30px; min-width:30px; font-size:14px; } }

/* ── Day view ── */
.dp-weekdays {
  display:grid; grid-template-columns:repeat(7,1fr);
  margin-bottom:1vw; text-align:center;
}
@media(min-width:560px){ .dp-weekdays{ margin-bottom:4px; } }

.dp-weekday { font-size:2.4vw; font-weight:700; color:#a8c0e8; padding:.8vw 0; }
@media(min-width:560px){ .dp-weekday{ font-size:11px; padding:3px 0; } }

.dp-days { display:grid; grid-template-columns:repeat(7,1fr); gap:.5vw; }
@media(min-width:560px){ .dp-days{ gap:2px; } }

.dp-day {
  aspect-ratio:1; display:flex; align-items:center; justify-content:center;
  font-size:2.8vw; border-radius:50%; cursor:pointer;
  color:#1a3a6b; font-weight:600; transition:all .15s;
}
@media(min-width:560px){ .dp-day{ font-size:13px; } }
.dp-day:hover    { background:#e8edf5; }
.dp-day.today    { border:1.5px solid #1a3a6b; }
.dp-day.selected { background:#1a3a6b; color:white; }
.dp-day.empty    { cursor:default; }

/* ── Month / Year grid view ── */
.dp-grid {
  display:grid; grid-template-columns:repeat(3,1fr);
  gap:2vw; padding:1vw 0;
}
@media(min-width:560px){ .dp-grid{ gap:8px; padding:4px 0; } }

.dp-grid-item {
  padding:2vw; text-align:center; border-radius:2vw;
  font-size:3vw; font-weight:600; color:#1a3a6b;
  cursor:pointer; border:1px solid transparent;
  transition:all .15s;
}
@media(min-width:560px){ .dp-grid-item{ padding:8px; border-radius:8px; font-size:13px; } }
.dp-grid-item:hover    { background:#e8edf5; }
.dp-grid-item.selected { background:#1a3a6b; color:white; }
.dp-grid-item.current  { border-color:#1a3a6b; }

/* ── Footer buttons ── */
.dp-footer {
  display:flex; gap:2vw; margin-top:3vw;
}
@media(min-width:560px){ .dp-footer{ gap:8px; margin-top:12px; } }

.dp-footer-btn {
  flex:1; padding:2.5vw; border-radius:2vw;
  font-family:'Cairo',sans-serif; font-size:2.8vw;
  font-weight:700; cursor:pointer; border:1px solid #c5cfe0;
  transition:all .15s;
}
@media(min-width:560px){ .dp-footer-btn{ padding:9px; border-radius:8px; font-size:13px; } }

.dp-today-btn { background:#f0f4fa; color:#1a3a6b; }
.dp-today-btn:hover { background:#e0e8f4; }

.dp-save-btn  { background:#1a3a6b; color:white; border-color:#1a3a6b; }
.dp-save-btn:hover { opacity:.85; }

.date-header-clickable:hover .day-name-ar { opacity:.8; }

.dp-title-btn:hover { background:#1a3a6b; color:white; }
@media(min-width:560px){ .dp-title-btn{ border-radius:6px; padding:3px 10px; font-size:15px; } }

.dp-nav {
  background:none; border:1.5px solid #1a3a6b;
  border-radius:50%; width:7vw; height:7vw; min-width:7vw;
  color:#1a3a6b; font-size:3vw; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all .15s;
}
.dp-nav:hover { background:#1a3a6b; color:white; }
@media(min-width:560px){ .dp-nav{ width:30px; height:30px; min-width:30px; font-size:14px; } }

/* ── Day view ── */
.dp-weekdays {
  display:grid; grid-template-columns:repeat(7,1fr);
  margin-bottom:1vw; text-align:center;
}
@media(min-width:560px){ .dp-weekdays{ margin-bottom:4px; } }

.dp-weekday { font-size:2.4vw; font-weight:700; color:#a8c0e8; padding:.8vw 0; }
@media(min-width:560px){ .dp-weekday{ font-size:11px; padding:3px 0; } }

.dp-days { display:grid; grid-template-columns:repeat(7,1fr); gap:.5vw; }

  aspect-ratio:1; display:flex; align-items:center; justify-content:center;

}

.dp-day:hover    { background:#e8edf5; }
.dp-day.today    { border:1.5px solid #1a3a6b; }
.dp-day.selected { background:#1a3a6b; color:white; }
.dp-day.empty    { cursor:default; }

/* ── Month / Year grid view ── */
.dp-grid {
  display:grid; grid-template-columns:repeat(3,1fr);
  gap:2vw; padding:1vw 0;
}
@media(min-width:560px){ .dp-grid{ gap:8px; padding:4px 0; } }

  padding:2vw; text-align:center; border-radius:2vw;

  transition:all .15s;

.dp-grid-item:hover    { background:#e8edf5; }

.dp-grid-item.current  { border-color:#1a3a6b; }

/* ── Footer buttons ── */
.dp-footer {
  display:flex; gap:2vw; margin-top:3vw;
}
@media(min-width:560px){ .dp-footer{ gap:8px; margin-top:12px; } }

.dp-footer-btn {
  flex:1; padding:2.5vw; border-radius:2vw;
  font-family:'Cairo',sans-serif; font-size:2.8vw;

  transition:all .15s;
}
@media(min-width:560px){ .dp-footer-btn{ padding:9px; border-radius:8px; font-size:13px; } }

.dp-today-btn { background:#f0f4fa; color:#1a3a6b; }

.dp-save-btn  { background:#1a3a6b; color:white; border-color:#1a3a6b; }

/* make date area clickable */
